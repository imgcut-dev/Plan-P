<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plan-P Admin</title>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/toastui-editor.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#4F46E5;--acct:#4338CA;--tint:#EEF2FF;--panel:#E8F0FE;--ink:#1F2328;--mut:#5B6470;--line:#E6E8EB;--surf:#F7F7F5;--red:#C62828}
*{box-sizing:border-box;margin:0}
body{font:14px/1.6 "Noto Sans KR",sans-serif;background:var(--surf);color:var(--ink)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:.02em}
.mark{width:30px;height:30px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700}
.badge{height:20px;padding:0 7px;border-radius:5px;background:var(--tint);color:var(--acct);font-size:10px;font-weight:700;display:flex;align-items:center}
#app[hidden]{display:none}
/* app */
#app{display:flex;flex-wrap:wrap;min-height:100vh}
aside.sb{flex:0 0 232px;background:#fff;border-right:1px solid var(--line);padding:20px 0;display:flex;flex-direction:column}
aside.sb .logo{padding:0 22px 18px}
.mn{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.mn a{height:40px;padding:0 12px;border-radius:8px;display:flex;align-items:center;font-weight:500;cursor:pointer}
.mn a:hover{background:var(--surf)}.mn a.on{background:var(--tint);color:var(--acct);font-weight:700}
.sf{margin-top:auto;padding:0 22px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:8px}
.ct{flex:1 1 640px;min-width:0;display:flex;flex-direction:column}
.th{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.th h1{font-size:18px}.th .ac{display:flex;gap:8px;align-items:center}
.bd{padding:24px 28px 56px}
h2{font-size:22px;margin-bottom:4px}.lead{color:var(--mut);font-size:13px;margin-bottom:20px}
h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--line);margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.btn{background:var(--acc);color:#fff;height:38px;padding:0 18px;border:0;border-radius:8px;font-weight:700;font-size:13px;display:inline-flex;align-items:center}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}.btn.o:hover{border-color:var(--ink)}
.btn.s{height:32px;padding:0 12px}.btn.r{background:#fff;color:var(--red);border:1px solid var(--line)}
.ib{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:#fff}.ib:hover{border-color:var(--ink)}
input,select,textarea{font:inherit;width:100%;padding:0 12px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{height:auto;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
input[type=color]{width:60px;padding:2px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 5px}
.panel{background:var(--panel);border-radius:8px;padding:18px}.panel h3{font-size:14px;margin-bottom:2px}
.row{display:grid;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.r-menu,.hd{grid-template-columns:1fr 1.6fr 96px}.hd{display:grid;gap:10px;font-size:12px;font-weight:700;color:var(--mut);padding:0 0 6px}.r-add{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.r-add label{margin:0 0 5px}
.pvnav{display:flex;gap:22px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 20px;min-height:48px;align-items:center;font-weight:500}.pvnav span:first-child{color:var(--acct);font-weight:700;box-shadow:0 3px 0 var(--acc)}.acts{display:flex;gap:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}th{font-size:11px;letter-spacing:.06em;color:var(--mut);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#FBFBFA}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}tr:last-child td{border:0}
.btn,.st{white-space:nowrap}td:nth-child(n+4){white-space:nowrap}
.thumb{width:54px;height:42px;object-fit:cover;border-radius:6px;background:var(--tint);display:block}
.st{height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;background:var(--tint);color:var(--acct)}.st.d{background:#EEE;color:var(--mut)}
.ed{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}.ed>.m{flex:999 1 560px;min-width:0}.ed>aside{flex:1 1 260px;max-width:320px;min-width:240px;display:flex;flex-direction:column;gap:16px}
.prev{aspect-ratio:16/10;border-radius:8px;object-fit:cover;background:#fff;width:100%;display:block;margin:10px 0 0}
.chk{display:flex;align-items:center;gap:6px;margin:0;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}.chk input{width:auto;height:auto;margin:0;accent-color:var(--acc)}
dialog{margin:auto;border:0;border-radius:14px;padding:24px;width:min(440px,92vw);color:var(--ink)}dialog::backdrop{background:rgba(31,35,40,.4)}dialog h3{font-size:17px;margin-bottom:6px}dialog p{color:var(--mut);font-size:13px;margin-bottom:12px}dialog .chk{margin-top:8px}dialog select{margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{display:flex;gap:8px;margin-top:22px}
.note{background:#fff;border-left:3px solid var(--acc);border-radius:6px;padding:14px 16px;font-size:13px;color:var(--mut);margin-top:16px}.note b{color:var(--ink)}
.pv{border:1px solid var(--line);background:#fff;border-radius:12px;padding:22px;text-align:center}.pv .logo{justify-content:center;font-size:28px}.pv .btn{margin-top:12px}
.sw{display:flex;align-items:center;gap:12px}.sw code{color:var(--mut);font-size:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){aside.sb{flex-basis:100%;border:0;border-bottom:1px solid var(--line);padding:12px 0}.mn{flex-direction:row;overflow-x:auto}.mn a{white-space:nowrap}.sf{display:none}.bd{padding:20px 16px}.two,.r-menu,.r-add{grid-template-columns:1fr}.hd{display:none}}
</style>
</head>
<body>

<div id="login" style="display:grid;place-items:center;min-height:100vh;padding:16px"><div class="pv" style="width:360px;max-width:100%"><div class="logo"><span class="mark">P</span><span>Plan-P</span><span class="badge">ADMIN</span></div>
 <p id="lmsg" class="lead" style="margin:14px 0 0">관리자 계정으로 로그인하세요</p><button class="btn" id="lbtn" onclick="login()" disabled>Google로 로그인</button></div></div>
<div id="app" hidden>
 <aside class="sb"><a class="logo" href="index.html"><span class="mark">P</span><span class="nm">Plan-P</span><span class="badge">ADMIN</span></a>
  <nav class="mn" id="side" aria-label="관리 메뉴"></nav>
  <div class="sf"><a href="index.html" target="_blank" style="color:var(--acct);font-weight:500">사이트 보기 ↗</a><a onclick="FB.signOut(FB.auth)" style="cursor:pointer">로그아웃</a></div>
 </aside>
 <div class="ct"><div class="th" id="th"></div><div class="bd" id="main"></div></div>
</div>
<div id="toast"></div>
<datalist id="dl-cats"></datalist><datalist id="dl-links"></datalist>

<script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"></script>
<script src="https://uicdn.toast.com/editor/3.2.2/i18n/ko-kr.js"></script>
<script src="data.js"></script>
<script>
addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&!i.src.endsWith("placeholder.svg"))i.src="placeholder.svg"},true);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TABS=[["posts","글 관리"],["write","글쓰기"],["menu","카테고리 관리"],["home","메인 관리"],["design","디자인 관리"],["data","데이터 · 게시"]];
let C,tab="posts",D=null,Di=-1,ED;
const today=()=>new Date().toISOString().slice(0,10);
// 카테고리 후보 = 카테고리 목록(nav)의 #/cat/이름 링크 + 글에 쓰인 카테고리
const cats=()=>[...new Set([...C.nav.map(n=>(n.url.match(/^#\/cat\/(.+)$/)||[])[1]).filter(Boolean).map(decodeURIComponent),...C.posts.flatMap(p=>p.cats)])];
const arr=p=>p.split(".").reduce((o,k)=>o[k],C);
const opts=(l,v)=>l.map(([a,b])=>`<option value="${esc(a)}" ${a===v?"selected":""}>${esc(b)}</option>`).join("");
const postOpts=()=>C.posts.map(p=>[p.id,p.title]);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
const cfgRef=()=>FB.doc(FB.db,"site","config"),cfgData=()=>({site:C.site,nav:C.nav,home:C.home});
async function save(m="저장했습니다. 사이트에 바로 반영됩니다"){if(C.nav.some(n=>!n.label.trim()))return toast("이름이 비어 있는 카테고리가 있습니다");try{await FB.setDoc(cfgRef(),cfgData());dirty=false;const e=$("#dirty");if(e)e.textContent="";toast(m)}catch{toast("저장 실패: 로그인과 네트워크를 확인하세요")}}
let dirty=false;
const mark=()=>{dirty=true;const e=$("#dirty");if(e)e.textContent="저장하지 않은 변경이 있습니다";const v=$("#pvn");if(v)v.innerHTML=navPv()};
async function go(t){
 if(dirty){if(!confirm("카테고리 변경을 아직 저장하지 않았습니다. 저장하지 않고 이동하면 변경이 사라집니다."))return;dirty=false;C=await loadCfg(true)}
 tab=t;D=null;if(t==="write")newPost();render()}
function mv(p,i,d){const a=arr(p),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];mark();render()}
const mvB=(p,i)=>`<div class="acts"><button class="ib" aria-label="위로" onclick="mv('${p}',${i},-1)">↑</button><button class="ib" aria-label="아래로" onclick="mv('${p}',${i},1)">↓</button><button class="ib" aria-label="삭제" onclick="delRow('${p}',${i})">✕</button></div>`;
function delRow(p,i){const r=arr(p)[i];if(p==="nav"&&catOf(r)&&catCount(catOf(r)))return catDialog(i,true);if(!confirm(`"${r.label||r.title||"이 항목"}" 카테고리를 삭제할까요? (이 카테고리의 글은 지워지지 않습니다)`))return;arr(p).splice(i,1);mark();render()}
const head=(t,act="")=>{$("#th").innerHTML=`<h1>${t}</h1><div class="ac">${act}</div>`};

/* 글 관리 */
function posts(){
 head("글 관리",`<button class="btn" onclick="go('write')">+ 글쓰기</button>`);
 return `<h2>글 관리</h2><p class="lead">글 ${C.posts.length}개 · 최신순</p>
 <div class="card"><table><tr><th></th><th>제목</th><th>카테고리</th><th>상태</th><th>날짜</th><th></th></tr>
 ${C.posts.map((p,i)=>[p,i]).sort((a,b)=>b[0].date.localeCompare(a[0].date)).map(([p,i])=>`<tr>
  <td><img class="thumb" src="${esc(p.img||"placeholder.svg")}" alt=""></td><td><b>${esc(p.title)}</b></td><td>${esc(p.cats.join(", "))}</td>
  <td><span class="st ${p.status==="draft"?"d":""}">${p.status==="draft"?"임시":"발행"}</span></td><td style="color:var(--mut);white-space:nowrap">${esc(p.date)}</td>
  <td><div class="acts"><button class="btn o s" onclick="editPost(${i})">수정</button><a class="btn o s" href="index.html#/post/${encodeURIComponent(p.id)}" target="_blank">보기</a><button class="btn o s" onclick="toggle(${i})">${p.status==="draft"?"발행":"비공개"}</button><button class="btn r s" onclick="delPost(${i})">삭제</button></div></td></tr>`).join("")}</table></div>`;
}
/* 글쓰기 */
function newPost(){D={id:"p"+Date.now().toString(36),title:"",cats:[],author:"Admin",date:today(),status:"draft",img:"",ex:"",body:""};Di=-1}
function editPost(i){D=structuredClone(C.posts[i]);Di=i;tab="write";render()}
function write(){
 if(!D)newPost();
 head(Di<0?"글쓰기":"글 수정",`<span style="font-size:12px;color:var(--mut)">${Di<0?"새 글":"저장된 글"}</span>
  <button class="btn o" onclick="savePost('draft')">임시저장</button><button class="btn" onclick="savePost('published')">발행</button>`);
 return `<div class="ed"><div class="m">
  <label for="f-title" style="margin-top:0">제목</label><input id="f-title" style="height:52px;font-size:20px;font-weight:700" value="${esc(D.title)}">
  <label for="f-ex">요약 (카드·대표 글에 표시)</label><textarea id="f-ex" rows="2">${esc(D.ex)}</textarea>
  <label>본문</label><div id="f-body"></div>
  ${Di>=0?`<div class="bar"><button class="btn r" onclick="delPost(Di)">이 글 삭제</button></div>`:""}
 </div>
 <aside>
  <div class="panel"><h3>발행 설정</h3>
   <label for="f-st">상태</label><select id="f-st">${opts([["draft","임시저장"],["published","발행"]],D.status||"draft")}</select>
   <label for="f-date">발행일</label><input type="date" id="f-date" value="${esc(D.date)}">
   <label for="f-author">작성자</label><input id="f-author" value="${esc(D.author)}"></div>
  <div class="panel"><h3>카테고리</h3>
   <div id="f-catbox" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${cats().map(c=>`<label class="chk"><input type="checkbox" value="${esc(c)}" ${D.cats.includes(c)?"checked":""}>${esc(c)}</label>`).join("")}</div>
   <label for="f-cats">새 카테고리 추가 (쉼표로 구분)</label><input id="f-cats" placeholder="예: Review"></div>
  <div class="panel"><h3>대표 이미지</h3>
   <img id="pv" class="prev" src="${esc(D.img||"placeholder.svg")}" alt="">
   <label for="f-img">이미지 URL</label><input id="f-img" value="${esc(D.img)}" placeholder="https://" oninput="$('#pv').src=this.value||'placeholder.svg'"></div>
 </aside></div>`;
}
// 본문 에디터: TOAST UI Editor(NHN, MIT). 마크다운으로 저장. 이미지는 URL만 허용(Firebase Storage 연결 시 업로드 훅 교체)
function initEditor(){
 ED=new toastui.Editor({el:$("#f-body"),height:"520px",initialEditType:"wysiwyg",previewStyle:"vertical",language:"ko-KR",initialValue:D.body||"",
  placeholder:"내용을 입력하세요",hooks:{addImageBlobHook:()=>toast("이미지는 'URL' 탭에 주소를 넣어주세요")}});
}
async function savePost(status){
 const g=id=>$("#"+id).value.trim();
 if(!g("f-title"))return toast("제목을 입력하세요");
 const p={id:D.id,title:g("f-title"),cats:[...new Set([...document.querySelectorAll("#f-catbox input:checked")].map(i=>i.value).concat(g("f-cats").split(",").map(s=>s.trim())).filter(Boolean))],author:g("f-author")||"Admin",date:g("f-date")||today(),
  status,img:g("f-img"),ex:g("f-ex"),body:ED.getMarkdown()};
 try{await FB.setDoc(FB.doc(FB.db,"posts",p.id),p)}catch{return toast("저장 실패: 로그인과 네트워크를 확인하세요")}
 Di<0?C.posts.unshift(p):C.posts[Di]=p;
 // 발행하는 글의 카테고리가 카테고리 목록(상단 메뉴)에 없으면 자동 추가
 const add=status==="published"?p.cats.filter(c=>!C.nav.some(n=>n.url==="#/cat/"+c)):[];
 if(add.length){C.nav.push(...add.map(c=>({label:c,url:"#/cat/"+c})));await save(`발행했습니다. 새 카테고리(${add.join(", ")})를 카테고리 목록에 추가했습니다`)}
 else toast(status==="draft"?"임시저장했습니다":"발행했습니다");
 D=null;tab="posts";render();
}
async function delPost(i=Di){const p=C.posts[i];if(!confirm(`"${p.title}" 글을 삭제할까요? 되돌릴 수 없습니다.`))return;
 try{await FB.deleteDoc(FB.doc(FB.db,"posts",p.id))}catch{return toast("삭제 실패: 로그인과 네트워크를 확인하세요")}
 C.posts.splice(i,1);toast("삭제했습니다");D=null;tab="posts";render()}
async function toggle(i){const p=C.posts[i],st=p.status==="draft"?"published":"draft";
 try{await FB.setDoc(FB.doc(FB.db,"posts",p.id),{...p,status:st})}catch{return toast("변경 실패: 로그인과 네트워크를 확인하세요")}
 p.status=st;toast(st==="draft"?"비공개로 바꿨습니다":"발행했습니다");render()}

/* 메뉴 */
const catOf=n=>n.url.startsWith("#/cat/")?n.url.slice(6):null;
const catCount=c=>C.posts.filter(p=>p.cats.includes(c)).length;
// 카테고리에 글이 있을 때: 삭제(del) 또는 글 옮기기. 글은 Firestore에 바로 반영된다
function catDialog(i,del){
 const c=catOf(C.nav[i]),k=catCount(c),others=cats().filter(x=>x!==c);
 if(!del&&!others.length)return toast("옮길 다른 카테고리가 없습니다");
 let d=$("#cd");if(!d){d=document.createElement("dialog");d.id="cd";document.body.append(d)}
 d.innerHTML=`<h3>${esc(c)} 카테고리 ${del?"삭제":"글 옮기기"}</h3><p>이 카테고리에 글이 ${k}개 있습니다. 글은 지워지지 않습니다.</p>
  ${others.length?`<label class="chk"><input type="radio" name="cm" value="move" checked>다른 카테고리로 옮기기</label><select id="cmt" aria-label="옮길 카테고리">${others.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`:""}
  ${del?`<label class="chk"><input type="radio" name="cm" value="drop" ${others.length?"":"checked"}>카테고리만 빼기 (글은 카테고리 없이 남습니다)</label>`:""}
  <div class="bar"><button class="btn o" onclick="$('#cd').close()">취소</button><button class="btn ${del?"r":""}" onclick="runCat(${i},${del})">${del?"삭제":"옮기기"}</button></div>`;
 d.showModal();
}
async function runCat(i,del){
 const c=catOf(C.nav[i]),r=document.querySelector("#cd input[name=cm]:checked"),t=(!del||r?.value==="move")?$("#cmt")?.value:null;
 const ps=C.posts.filter(p=>p.cats.includes(c)).map(p=>({...p,cats:[...new Set(p.cats.filter(x=>x!==c).concat(t||[]))]}));
 try{const b=FB.writeBatch(FB.db);ps.forEach(p=>b.set(FB.doc(FB.db,"posts",p.id),p));await b.commit()}
 catch{return toast("실패했습니다: 로그인과 네트워크를 확인하세요")}
 ps.forEach(p=>{C.posts[C.posts.findIndex(x=>x.id===p.id)]=p});
 if(del)C.nav.splice(i,1);
 if(t&&!C.nav.some(n=>n.url==="#/cat/"+t))C.nav.push({label:t,url:"#/cat/"+t});
 $("#cd").close();await save(del?`삭제했습니다. 글 ${ps.length}개는 ${t?`"${t}"로 옮겼습니다`:"카테고리 없이 남겼습니다"}`:`글 ${ps.length}개를 "${t}"로 옮겼습니다`);render();
}
const isCat=u=>cats().some(c=>u==="#/cat/"+c),isKnown=u=>u==="#/"||u==="#/all"||isCat(u);
const linkOpts=v=>`<option value="#/" ${v==="#/"?"selected":""}>홈 (메인 화면)</option><option value="#/all" ${v==="#/all"?"selected":""}>전체 글 목록</option>
 <optgroup label="카테고리별 글 목록"><option value="newcat" ${v==="newcat"?"selected":""}>이 이름의 카테고리 글 (새 카테고리 만들기)</option>${cats().map(c=>`<option value="#/cat/${esc(c)}" ${v==="#/cat/"+c?"selected":""}>${esc(c)} 카테고리 글</option>`).join("")}</optgroup>
 <optgroup label="기타"><option value="custom" ${v==="custom"?"selected":""}>다른 사이트 주소 직접 입력</option></optgroup>`;
const navPv=()=>C.nav.map(n=>`<span>${esc(n.label||"(이름 없음)")}</span>`).join("");
function setLink(i,v){
 if(v==="newcat"){const n=C.nav[i].label.trim();if(!n){toast("먼저 카테고리 이름을 입력하세요");return render()}v="#/cat/"+n}
 C.nav[i].url=v==="custom"?"https://":v;mark();render()}
const dest=u=>u==="#/"?"홈 (메인 화면)":u==="#/all"?"전체 글 목록":u.startsWith("#/cat/")?`${u.slice(6)} 카테고리 글`:u;
function addNav(){
 const label=$("#nn").value.trim();
 if(!label)return toast("카테고리 이름을 입력하세요");
 if(C.nav.some(n=>n.label===label))return toast("같은 이름의 카테고리가 이미 있습니다");
 C.nav.push({label,url:"#/cat/"+label});mark();render();
 toast("추가했습니다. 오른쪽 위 저장을 눌러야 사이트에 반영됩니다");
}
function menu(){
 head("카테고리 관리",`<span id="dirty" style="font-size:12px;color:var(--red)">${dirty?"저장하지 않은 변경이 있습니다":""}</span><button class="btn" onclick="save()">저장</button>`);
 return `<h2>카테고리 관리</h2><p class="lead">사이트 맨 위에 보이는 카테고리입니다. 글을 쓸 때 고르는 카테고리와 같습니다. 홈과 전체 글 링크의 순서도 여기서 정합니다. 이름만 정하면 됩니다. 바꾼 뒤에는 오른쪽 위 <b>저장</b>을 눌러야 사이트에 반영됩니다.</p>
 <div class="panel"><h3>새 카테고리 만들기</h3><p style="font-size:13px;color:var(--mut)">이름만 입력하면 됩니다. 같은 이름의 카테고리 글 목록으로 자동 연결됩니다.</p><div class="r-add" style="margin-top:12px">
  <div><label for="nn">카테고리 이름 (사이트에 보이는 글자)</label><input id="nn" placeholder="예: 여행 이야기"></div>
  <button class="btn" style="height:40px" onclick="addNav()">+ 카테고리 추가</button></div></div>
 <h4>카테고리 목록 <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--mut)">위에서부터 사이트에 보이는 순서입니다</span></h4>
 <div class="hd"><span>카테고리 이름</span><span>연결된 곳</span><span></span></div>
 ${C.nav.map((n,i)=>{const ext=!isKnown(n.url);return `<div class="row r-menu"><input aria-label="카테고리 이름" value="${esc(n.label)}" oninput="C.nav[${i}].label=this.value;mark()">
  <div><details ${ext?"open":""}><summary style="cursor:pointer;color:var(--mut);padding:9px 0">${esc(dest(n.url))}${catOf(n)?` · 글 ${catCount(catOf(n))}개`:""} <span style="color:var(--acct)">· 바꾸기</span></summary><select aria-label="연결할 곳" onchange="setLink(${i},this.value)">${linkOpts(ext?"custom":n.url)}</select>${ext?`<input style="margin-top:6px" aria-label="연결할 주소" placeholder="https://" value="${esc(n.url)}" oninput="C.nav[${i}].url=this.value;mark()">`:""}</details>${catOf(n)&&catCount(catOf(n))?`<button class="btn o s" onclick="catDialog(${i},false)">글 다른 카테고리로 옮기기</button>`:""}</div>
  ${mvB("nav",i)}</div>`}).join("")}
 <h4>사이트에서 이렇게 보입니다</h4><div class="pvnav" id="pvn">${navPv()}</div>`;
}
/* 메인 */
function home(){
 head("메인 관리",`<button class="btn" onclick="save()">저장</button>`);
 const H=C.home,po=postOpts();H.picks=H.picks||[];
 return `<h2>메인 관리</h2><p class="lead">메인 페이지에 보여 줄 글을 정합니다.</p>
 <div class="panel" style="max-width:640px"><h3>대표 글</h3><label for="h0">가운데 큰 글</label><select id="h0" onchange="C.home.feature=this.value">${opts(po,H.feature)}</select>
  <h3 style="margin-top:18px">추천 글 (3개)</h3>${[0,1,2].map(i=>`<label for="h${i+1}">추천 ${i+1}</label><select id="h${i+1}" onchange="C.home.picks[${i}]=this.value">${opts(po,H.picks[i])}</select>`).join("")}
  <h3 style="margin-top:18px">최신 글</h3><label for="hc">표시 개수</label><select id="hc" onchange="C.home.count=+this.value">${opts([["3","3개"],["6","6개"],["9","9개"]],String(H.count||6))}</select></div>`;
}
/* 디자인 */
function design(){
 head("디자인 관리",`<button class="btn" onclick="save()">저장</button>`);
 const S=C.site;
 return `<h2>디자인 관리</h2><p class="lead">사이트 이름, 포인트 색, 푸터 문구를 바꿉니다.</p>
 <div style="max-width:640px"><label for="d1" style="margin-top:0">블로그 이름 (로고)</label><input id="d1" value="${esc(S.name)}" oninput="S_('name',this.value)">
 <div class="two"><div><label>포인트 색 (버튼·선택)</label><div class="sw"><input type="color" value="${S.accent}" oninput="S_('accent',this.value)"><code>${S.accent}</code></div></div>
 <div><label>링크·라벨 글자색</label><div class="sw"><input type="color" value="${S.accentText||S.accent}" oninput="S_('accentText',this.value)"><code>${S.accentText||S.accent}</code></div></div></div>
 <label for="d2">푸터 문구</label><input id="d2" value="${esc(S.footer)}" oninput="S_('footer',this.value)">
 <label>미리보기</label><div class="pv"><div class="logo"><span class="mark" id="pm" style="background:${S.accent}">${esc((S.name||"P")[0])}</span><span id="pl">${esc(S.name)}</span></div><span class="btn" id="pb" style="background:${S.accent}">전체 글 보기</span> <span id="pt" style="color:${S.accentText||S.accent};font-weight:700;margin-left:12px">링크 글자</span></div>
 <div class="note">글자색은 흰 배경 위에서 읽기 쉬운 진한 색을 고르세요. 기본값 <b>#4338CA</b>는 대비 7.9:1입니다.</div></div>`;
}
function S_(k,v){C.site[k]=v;const l=$("#pl");if(l){l.textContent=C.site.name;$("#pm").textContent=(C.site.name||"P")[0];$("#pm").style.background=$("#pb").style.background=C.site.accent;$("#pt").style.color=C.site.accentText||C.site.accent}document.querySelectorAll(".nm").forEach(e=>e.textContent=C.site.name)}
/* 데이터 */
function data(){
 head("데이터");
 return `<h2>데이터</h2><p class="lead">글과 설정은 Firebase(Firestore)에 저장됩니다. 처음 한 번 샘플 데이터를 올릴 수 있습니다.</p>
 <div class="note" style="margin-top:0"><b>샘플 데이터 올리기</b><br>샘플 글 ${DEFAULT.posts.length}개와 사이트 설정을 저장합니다. 같은 id의 글과 사이트 설정은 덮어씁니다.</div>
 <div class="bar"><button class="btn" onclick="seed()">샘플 데이터 올리기</button><button class="btn o" onclick="exp()">data.json 내보내기 (백업)</button></div>`;
}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,1)],{type:"application/json"}));a.download="data.json";a.click()}
async function seed(){
 if(!confirm("샘플 데이터를 올립니다. 같은 id의 글과 사이트 설정은 덮어씁니다."))return;
 try{const d=structuredClone(DEFAULT),b=FB.writeBatch(FB.db);
  b.set(cfgRef(),{site:d.site,nav:d.nav,home:d.home});d.posts.forEach(p=>b.set(FB.doc(FB.db,"posts",p.id),p));await b.commit();
  C=await loadCfg(true);render();toast("올렸습니다")}catch{toast("올리기 실패: 로그인과 네트워크를 확인하세요")}
}

const V={posts,write,menu,home,design,data};
function render(){
 $("#side").innerHTML=TABS.map(([k,l])=>`<a class="${k===tab?"on":""}" onclick="go('${k}')">${l}</a>`).join("");
 $("#dl-cats").innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join("");
 $("#dl-links").innerHTML=`<option value="#/"><option value="#/all">`+cats().map(c=>`<option value="#/cat/${esc(c)}">`).join("");
 $("#main").innerHTML=V[tab]();
 if(tab==="write")initEditor();
 document.querySelectorAll(".nm").forEach(e=>e.textContent=C.site.name);
}
// 관리자 인증: Google 로그인 → site/admin 읽기가 통과하면(규칙: 관리자 이메일만) 관리자
let FB;
const show=on=>{$("#app").hidden=!on;$("#login").hidden=on;$("#login").style.display=on?"none":"grid"};
const login=()=>FB.signInWithPopup(FB.auth,new FB.GoogleAuthProvider()).catch(()=>toast("로그인을 취소했거나 실패했습니다"));
import("./fb.js").then(m=>{FB=m;$("#lbtn").disabled=false;
 FB.onAuthStateChanged(FB.auth,async u=>{
  if(!u)return show(false);
  try{await FB.getDoc(FB.doc(FB.db,"site","admin"))}
  catch{$("#lmsg").textContent="관리자 계정이 아닙니다. 다른 계정으로 로그인하세요";return FB.signOut(FB.auth)}
  C=await loadCfg(true);show(true);render();
 });
});
</script>
</body>
</html>
