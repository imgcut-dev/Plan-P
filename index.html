<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan-P — Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--line:#e5e5e5;--acc:#0a6fd6;--ph:#e9e9e9}
:root[data-theme=dark]{--bg:#121212;--fg:#f2f2f2;--mut:#a0a0a0;--line:#2c2c2c;--acc:#4da3ff;--ph:#222}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 Inter,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--fg)}
a{color:inherit;text-decoration:none;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover;background:var(--ph)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
/* header */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 0}
.top .l{display:flex;gap:14px}.top .r{text-align:right}
.logo{font-size:40px;font-weight:700;letter-spacing:.04em}
.ic{width:20px;height:20px;display:grid;place-items:center;font-size:15px;opacity:.75}
.sub{background:var(--acc);color:#fff;padding:6px 14px;border-radius:4px;font-weight:600;font-size:12px}
nav{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav ul{list-style:none;display:flex;justify-content:center;gap:28px;padding:0;flex-wrap:wrap}
nav a{display:block;padding:10px 2px;font-size:12px;border-top:2px solid transparent;margin-top:-1px}
nav a.on{border-top-color:var(--fg)}
/* cards */
.cat{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.cat a+a:before{content:" · ";color:var(--mut)}
.date{font-size:11px;color:var(--mut)}
.card h3{font-size:15px;line-height:1.25;margin:4px 0 6px;font-weight:700}
.card p{font-size:12px;color:var(--mut);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .im{aspect-ratio:5/4;overflow:hidden;margin-bottom:10px}
.card .im img{transition:transform .4s}.card:hover .im img{transform:scale(1.04)}
.card:hover h3{color:var(--acc)}
/* hero */
.hero{display:grid;grid-template-columns:210px 1fr 250px;gap:22px;padding:22px 0 26px}
.hero>*+*{border-left:1px solid var(--line);padding-left:22px}
.stack{display:flex;flex-direction:column;gap:32px}
.stack .im{aspect-ratio:1/.9}
.feat .im{aspect-ratio:16/10;overflow:hidden}
.feat{text-align:center}.feat .cat{display:block;margin:14px 0 8px}
.feat h2{font-size:28px;line-height:1.2;margin-bottom:12px}
.feat p{color:var(--mut);max-width:480px;margin:0 auto 10px;font-size:13px}
.feat .date b{font-weight:500;color:var(--fg)}
.latest h4,.sec h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;justify-content:space-between}
.sec h4 a{color:var(--acc);text-transform:none;font-weight:500;letter-spacing:0}
.li{display:grid;grid-template-columns:1fr 62px;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li h5{font-size:12px;line-height:1.3}.li .im{aspect-ratio:1;overflow:hidden}
.li:hover h5{color:var(--acc)}
/* sections */
.sec{padding:22px 0 14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:14px}
.pol{display:grid;grid-template-columns:2fr 1fr;gap:22px;margin-top:14px}
.pol .big .im{aspect-ratio:16/10}.pol .big h3{font-size:24px}.pol .big p{font-size:13px;-webkit-line-clamp:2}
.pol .side{display:grid;grid-template-columns:1fr 1fr;gap:22px;border-left:1px solid var(--line);padding-left:22px}
.pol .side .im{aspect-ratio:5/4}
.by{display:flex;align-items:center;gap:8px;font-size:12px}
.by i{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
/* article */
.art{max-width:720px;margin:36px auto}
.art h1{font-size:40px;line-height:1.15;margin:10px 0}
.art .im{aspect-ratio:16/9;margin:22px 0}
.art p.b{font-size:16px;line-height:1.8;margin-bottom:18px}
.pg{margin:34px 0 10px;font-size:22px}
.art .toastui-editor-contents{font:16px/1.8 Inter,"Apple SD Gothic Neo",sans-serif;color:var(--fg);margin-bottom:18px}
.art .toastui-editor-contents p,.art .toastui-editor-contents li{font-size:16px;line-height:1.8;color:var(--fg)}
.art .toastui-editor-contents h1,.art .toastui-editor-contents h2,.art .toastui-editor-contents h3{color:var(--fg);border-color:var(--line)}
.art .toastui-editor-contents img{max-width:100%}.art .toastui-editor-contents a{color:var(--acc)}
.back{color:var(--acc);font-size:13px}
/* modal */
dialog{border:0;border-radius:8px;padding:28px;background:var(--bg);color:var(--fg);width:min(400px,92vw);margin:auto}
dialog::backdrop{background:#0008}
dialog h3{margin-bottom:6px}dialog p{color:var(--mut);margin-bottom:14px}
dialog input{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);margin-bottom:10px}
dialog .sub{width:100%;padding:10px}
#q{display:none;border-bottom:1px solid var(--line);padding:10px 0}
#q.on{display:block}#q input{width:100%;border:0;outline:0;font-size:18px;background:none;color:var(--fg)}
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0;color:var(--mut);font-size:12px;text-align:center}
@media(max-width:900px){
 .hero{grid-template-columns:1fr}.hero>*+*{border:0;padding:0}.stack{flex-direction:row}.stack>*{flex:1}
 .g4{grid-template-columns:1fr 1fr}.pol{grid-template-columns:1fr}.pol .side{border:0;padding:0}
 .logo{font-size:30px}nav ul{gap:16px;overflow-x:auto;flex-wrap:nowrap}nav a{white-space:nowrap}.art h1{font-size:30px}
}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div class="l"><button class="ic" id="menu" title="Menu">☰</button><button class="ic" id="srch" title="Search">⌕</button><button class="ic" id="theme" title="Theme">☼</button></div>
  <a class="logo" href="#/" id="logo"></a>
  <div class="r"><button class="sub" id="subBtn"></button></div>
 </header>
</div>
<nav><div class="wrap"><ul id="nav"></ul></div></nav>
<div class="wrap">
 <div id="q"><input id="qi" placeholder="Search posts…"></div>
 <main id="app"></main>
 <footer id="foot"></footer>
</div>
<dialog id="dlg"><form method="dialog" id="sf">
 <h3>Subscribe</h3><p>새 글을 이메일로 받아보세요.</p>
 <input type="email" id="em" placeholder="you@example.com" required>
 <button class="sub">Subscribe</button>
</form></dialog>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{const t=new Date(d+"T00:00:00");return isNaN(t)?esc(d):t.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})};
const safe=u=>/^(#|https?:|\/|[\w.-]+\.html)/.test(u)?u:"#/";
let C,posts;
const by=id=>posts.find(p=>p.id===id), inCat=c=>posts.filter(p=>p.cats.includes(c));
const cats=p=>`<div class="cat">${p.cats.map(c=>`<a href="#/cat/${esc(c)}">${esc(c)}</a>`).join("")}</div>`;
const img=p=>`<div class="im"><img loading="lazy" src="${esc(p.img)}" alt=""></div>`;
const link=(p,h)=>`<a href="#/post/${esc(p.id)}">${h}</a>`;
const card=(p,ex=true)=>`<article class="card">${link(p,img(p))}${cats(p)}<h3>${link(p,esc(p.title))}</h3>${ex?`<p>${esc(p.ex)}</p>`:""}<div class="date">${fmt(p.date)}</div></article>`;
const sec=(c,body)=>`<section class="sec"><h4>${esc(c)}<a href="#/cat/${esc(c)}">View all »</a></h4>${body}</section>`;
const pick=ids=>(ids||[]).map(by).filter(Boolean);

function home(){
 const H=C.home,f=by(H.feature)||posts[0];if(!f)return`<p style="padding:60px 0;text-align:center;color:var(--mut)">아직 글이 없습니다.</p>`;
 const left=pick(H.left),late=pick(H.latest);
 return `<section class="hero">
  <div class="stack">${left.map(p=>`<article class="card">${link(p,img(p))}${cats(p)}<h3>${link(p,esc(p.title))}</h3><div class="date">${fmt(p.date)}</div></article>`).join("")}</div>
  <article class="feat">${link(f,img(f))}<div class="cat">${esc(f.cats[0]||"")}</div><h2>${link(f,esc(f.title))}</h2><p>${esc(f.ex)}</p><div class="date">${fmt(f.date)} · <b>${esc(f.author)}</b></div></article>
  <aside class="latest"><h4>Latest</h4>${late.map(p=>`<a class="li" href="#/post/${esc(p.id)}"><div><h5>${esc(p.title)}</h5><div class="date">${fmt(p.date)}</div></div><div class="im"><img loading="lazy" src="${esc(p.img)}" alt=""></div></a>`).join("")}</aside>
 </section>
 ${H.sections.map(s=>{
  const ps=inCat(s.cat);if(!ps.length)return"";
  if(s.layout==="feature"){const b=ps[0];return sec(s.cat,`<div class="pol"><article class="card big">${link(b,img(b))}${cats(b)}<h3>${link(b,esc(b.title))}</h3><p>${esc(b.ex)}</p><div class="by"><span class="date">${fmt(b.date)}</span><i>${esc(b.author[0]||"A")}</i>by ${esc(b.author)}</div></article><div class="side">${ps.slice(1,5).map(p=>card(p)).join("")}</div></div>`)}
  return sec(s.cat,`<div class="g4">${ps.slice(0,4).map(p=>card(p)).join("")}</div>`)}).join("")}`;
}
const list=(t,ps)=>sec(t,ps.length?`<div class="g4">${ps.map(p=>card(p)).join("")}</div>`:`<p style="padding:30px 0;color:var(--mut)">결과가 없습니다.</p>`);
function post(p){
 const rel=posts.filter(x=>x!==p&&x.cats.some(c=>p.cats.includes(c))).slice(0,4);
 return `<article class="art"><a class="back" href="#/">← Back</a>${cats(p)}<h1>${esc(p.title)}</h1>
  <div class="by"><i>${esc(p.author[0]||"A")}</i>by ${esc(p.author)} · <span class="date">${fmt(p.date)}</span></div>${img(p)}
  <p class="b"><b>${esc(p.ex)}</b></p><div id="pbody"></div>
  ${rel.length?`<h3 class="pg">Related</h3><div class="g4" style="grid-template-columns:1fr 1fr">${rel.map(x=>card(x,false)).join("")}</div>`:""}</article>`;
}
// 본문 마크다운 뷰어(TOAST UI Viewer, XSS 필터 내장)는 글 페이지에서만 지연 로드
const CDN="https://uicdn.toast.com/editor/3.2.2/",DEMO="Lorem ipsum dolor sit amet, ei officiis assueverit pri, duo volumus commune molestiae ad, cum at clita latine.\n\nId eam magna omnesque, ius ea rebum nostrum offendit. Per in recusabo facilisis, est ei choro veritus gloriatur.";
function showBody(md){
 const go=()=>{const el=$("#pbody");if(el)new toastui.Editor({el,initialValue:(md||"").trim()||DEMO})};
 if(window.toastui)return go();
 document.head.insertAdjacentHTML("beforeend",`<link rel="stylesheet" href="${CDN}toastui-editor-viewer.min.css">`);
 const s=document.createElement("script");s.src=CDN+"toastui-editor-viewer.min.js";s.onload=go;document.head.append(s);
}
function route(){
 const h=location.hash||"#/",[,k,v]=h.split("/").map(decodeURIComponent);
 let html;
 if(k==="post"&&by(v)){html=post(by(v));document.title=by(v).title+" — "+C.site.name}
 else{document.title=C.site.name+" — Blog";
  if(k==="cat")html=list(v,inCat(v));
  else if(k==="all")html=list("All posts",posts);
  else if(k==="search")html=list(`Search: ${v}`,posts.filter(p=>(p.title+p.ex+p.cats).toLowerCase().includes(v.toLowerCase())));
  else html=home();}
 $("#app").innerHTML=html;scrollTo(0,0);
 if(k==="post"&&by(v))showBody(by(v).body);
 $("#nav").innerHTML=C.nav.map(n=>`<li><a href="${esc(safe(n.url))}" class="${h===n.url?"on":""}">${esc(n.label)}</a></li>`).join("");
}
(async()=>{
 C=await loadCfg();
 posts=[...C.posts].sort((a,b)=>b.date.localeCompare(a.date)); // stable: 같은 날짜는 입력 순서 유지
 const S=C.site;
 document.head.insertAdjacentHTML("beforeend",`<style>:root{--acc:${S.accent}}:root[data-theme=dark]{--acc:${S.accentDark}}</style>`);
 $("#logo").textContent=S.name;$("#subBtn").textContent=S.subscribe;$("#foot").textContent=S.footer;
 const T=document.documentElement;
 try{T.dataset.theme=localStorage.theme||""}catch{}
 if(!T.dataset.theme)T.dataset.theme=S.theme==="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):S.theme;
 $("#theme").onclick=()=>{T.dataset.theme=T.dataset.theme==="dark"?"light":"dark";try{localStorage.theme=T.dataset.theme}catch{}};
 addEventListener("hashchange",route);route();
})();
$("#srch").onclick=()=>{$("#q").classList.toggle("on");$("#qi").focus()};
$("#qi").oninput=e=>{const v=e.target.value.trim();location.hash=v?"#/search/"+encodeURIComponent(v):"#/"};
$("#menu").onclick=()=>$("#nav").scrollIntoView({behavior:"smooth"});
// subscribe: 저장은 브라우저 localStorage뿐 (ponytail: 백엔드 없음, 이메일 서비스 연결 시 교체)
$("#subBtn").onclick=()=>$("#dlg").showModal();
$("#sf").onsubmit=()=>{try{const s=JSON.parse(localStorage.subs||"[]");s.push($("#em").value);localStorage.subs=JSON.stringify(s)}catch{};alert("구독해주셔서 감사합니다!")};
</script>
</body>
</html>
