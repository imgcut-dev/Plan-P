<style>
:root{--acc:#4F46E5;--acct:#4338CA;--tint:#EEF2FF;--panel:#E8F0FE;--tile:#E0E7FF;--ink:#1F2328;--mut:#5B6470;--line:#E6E8EB;--surf:#F7F7F5;--bg:#fff;--pline:var(--pline);--font:"Noto Sans KR",sans-serif;--hfont:var(--font);--r1:14px;--r2:12px;--r3:8px;--r4:6px}
h1,h2,h3{font-family:var(--hfont)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.6 var(--font);color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover;background:var(--tile)}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
/* header */
header{border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:32px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.02em}
.mark{width:30px;height:30px;border-radius:var(--r3);background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
nav{display:flex;gap:26px;flex:1 1 0;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} /* 메뉴가 많아도 한 줄 유지, 넘치면 옆으로 스크롤 */
nav::-webkit-scrollbar{display:none}
nav.fade{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent)}
nav a{padding:20px 0 17px;font-size:14px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;flex:none}
nav a.on{color:var(--acct);border-bottom-color:var(--acc)}
.tools{display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;border:0;background:none;border-radius:var(--r3);display:grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--surf)}
.btn-l{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r3);font-size:13px;font-weight:500;display:flex;align-items:center}
#q{display:none;border-bottom:1px solid var(--line);padding:10px 0}
#q.on{display:block}#q input{width:100%;border:0;outline:0;font-size:18px;background:none}
/* chips, labels */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:24px 0 8px}
.chip{height:34px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;display:flex;align-items:center;border:1px solid var(--line);background:var(--bg)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lb{height:22px;padding:0 9px;border-radius:var(--r4);background:var(--bg);color:var(--acct);font-size:12px;font-weight:700;display:flex;align-items:center;position:absolute;left:12px;bottom:12px}
.date{font-size:12px;color:var(--mut)}
.tag{font-size:12px;color:var(--acct);font-weight:500}
.panel{background:var(--panel);border-radius:var(--r3);padding:22px}
/* home */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:16px 0 8px}
.pick .thumb{height:200px;border-radius:var(--r1);overflow:hidden;position:relative}
.pick h3{font-size:18px;line-height:1.35;margin-top:10px}
.pick:hover h3,.card:hover h3,.row:hover h2{color:var(--acct)}
.two{display:flex;gap:32px;flex-wrap:wrap;padding-top:32px;align-items:flex-start}
.two>section{flex:999 1 640px;min-width:0}.two>aside{flex:1 1 280px;max-width:340px;min-width:260px}
h2.sh{font-size:16px;font-weight:700;margin-bottom:14px}
.feat{display:flex;gap:24px;flex-wrap:wrap}
.feat .thumb{flex:1 1 300px;min-height:240px;border-radius:var(--r1);overflow:hidden;position:relative}
.feat .tx{flex:1 1 300px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.feat h3{font-size:24px;line-height:1.3}.feat p{color:var(--mut)}
.about{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.av{width:72px;height:72px;border-radius:50%;background:var(--tile);color:var(--acc);display:grid;place-items:center;font-size:28px;font-weight:700}
.btn{height:38px;padding:0 18px;border-radius:var(--r3);background:var(--acc);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;margin-top:8px}
.btn-o{height:44px;padding:0 28px;border:1px solid var(--acc);color:var(--acct);border-radius:var(--r3);font-weight:700;display:inline-flex;align-items:center}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:48px 0 14px}
.head h2{font-size:16px}.head a{font-size:13px;font-weight:500;color:var(--acct)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
.card{display:flex;flex-direction:column;gap:8px}
.card .thumb{aspect-ratio:16/10;border-radius:var(--r2);overflow:hidden;position:relative}
.card h3{font-size:17px;line-height:1.4}
.card p{font-size:14px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{display:flex;justify-content:center;padding-top:36px}
/* list */
.crumb{font-size:13px;color:var(--mut);margin:32px 0 8px}
.crumb a,.head a{display:inline-block;padding:4px 7px;margin:-4px -7px} /* 누르는 영역을 24px 이상으로 (보이는 크기는 그대로) */
.lh{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.lh h1{font-size:30px;line-height:1.3}.lh p{color:var(--mut);font-size:14px}
.cols{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
.cols>section{flex:999 1 640px;min-width:0}.cols>aside{flex:1 1 260px;max-width:320px;min-width:240px;display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:24px;padding:22px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .thumb{flex:0 0 220px;height:140px;border-radius:var(--r2);overflow:hidden;position:relative}
.row .tx{flex:1 1 280px;display:flex;flex-direction:column;gap:6px;min-width:0}
.row h2{font-size:20px;line-height:1.4}.row p{font-size:14px;color:var(--mut)}
.pg{display:flex;justify-content:center;gap:6px;padding-top:32px}
.pg a{min-width:40px;height:40px;padding:0 10px;border-radius:var(--r3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;border:1px solid var(--line)}
.pg a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.side h2{font-size:16px;margin-bottom:12px}
.catl a{display:flex;justify-content:space-between;padding:12px 18px;font-size:14px;border-bottom:1px solid var(--pline)}
.catl a:last-child{border:0}.catl{background:var(--panel);border-radius:var(--r3);overflow:hidden}
.mini{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.mini .t{width:84px;height:64px;flex:none;border-radius:var(--r2);overflow:hidden}
.mini b{display:block;font-size:14px;font-weight:500;line-height:1.45}
.empty{padding:40px 0;color:var(--mut)}
/* article */
.art{max-width:760px;flex:999 1 640px;min-width:0}
.art h1{font-size:36px;line-height:1.3;margin:12px 0 14px}
.chip-s{display:inline-flex;height:26px;padding:0 10px;align-items:center;border-radius:var(--r4);background:var(--tint);color:var(--acct);font-size:12px;font-weight:700;margin-right:6px}
.meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut);padding-bottom:20px;border-bottom:1px solid var(--line)}
.meta .av{width:32px;height:32px;font-size:14px}
.hero{margin:28px 0;aspect-ratio:16/9;border-radius:var(--r1);overflow:hidden}
.lead{font-size:17px;font-weight:700;line-height:1.9;margin-bottom:12px}
.art .toastui-editor-contents{font:17px/1.9 var(--font);color:var(--ink)}
.art .toastui-editor-contents p,.art .toastui-editor-contents li{font-size:17px;line-height:1.9;color:var(--ink)}
.art .toastui-editor-contents h2,.art .toastui-editor-contents h3{color:var(--ink);border-color:var(--line);font-weight:700}
.art .toastui-editor-contents img{max-width:100%;border-radius:var(--r3)}
.art .toastui-editor-contents a{color:var(--acct)}
.art .toastui-editor-contents blockquote{background:var(--panel);border-left:4px solid var(--acc);border-radius:var(--r3);padding:14px 20px;color:var(--ink)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.tags a{height:32px;padding:0 14px;border-radius:999px;background:var(--surf);font-size:13px;display:flex;align-items:center;color:var(--acct);font-weight:500}
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:28px}
.pn a{background:var(--panel);border-radius:var(--r3);padding:16px 18px}.pn small{display:block;font-size:12px;color:var(--mut)}.pn b{font-weight:500}
/* 글씨 세로 가운데: 측정 결과 한글 라벨은 이미 가운데(±0.5px)이고, 영문 라벨은 약 0.05em 아래로 앉는다. 영문 라벨만 보정한다 */
.lb{padding-bottom:1px}
/* 데이터를 받기 전에는 빈 틀 대신 안내만 보여 준다 */
body:not(.ready) header,body:not(.ready) main,body:not(.ready) footer{visibility:hidden}
body:not(.ready)::before{content:"불러오는 중…";position:fixed;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px}
.share{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:28px}.share b{font-size:14px;margin-right:4px}
.share .btn-l{cursor:pointer;background:none;color:var(--ink)}.share .btn-l:hover{border-color:var(--acc);color:var(--acct)}
/* 추천·댓글 (comments.js) */
.cm{margin-top:40px;border-top:1px solid var(--line);padding-top:24px}
.cm-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.cm-h2{font-size:16px;font-weight:700;flex:1}
.cm button{cursor:pointer;background:none;border:0;color:var(--mut);font-size:13px;padding:4px 6px;border-radius:var(--r4)}
.cm button:hover{color:var(--acct)}
.cm .cm-k.on{color:var(--acct);font-weight:700}
.cm .cm-big{height:40px;padding:0 18px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--ink)}
.cm .cm-big.on{border-color:var(--acc);background:var(--tint)}
.cm-f textarea{width:100%;border:1px solid var(--line);border-radius:var(--r3);padding:12px;font:inherit;line-height:1.6;background:var(--bg);color:var(--ink);resize:vertical}
.cm-f textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.cm-r{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;font-size:12px;color:var(--mut)}
.cm-c{margin-right:10px}
.cm .cm-b{height:36px;padding:0 18px;background:var(--acc);color:#fff;font-weight:700;border-radius:var(--r3)}
.cm .cm-b:hover{color:#fff;opacity:.9}.cm .cm-b[disabled]{opacity:.5}
.cm .cm-login{height:44px;width:100%;border:1px dashed var(--line);border-radius:var(--r3);color:var(--acct);font-weight:500;font-size:14px}
.cm-l{list-style:none;padding:0;margin:0}
.cm-i{padding:18px 0;border-bottom:1px solid var(--line)}
.cm-re{margin-left:28px;padding:14px 0 0;border-bottom:0;border-left:2px solid var(--line);padding-left:16px;margin-top:10px}
.cm-h{display:flex;align-items:center;gap:8px;font-size:14px}.cm-h b{font-weight:500}.cm-d{font-size:12px;color:var(--mut)}
.cm-av{width:28px;height:28px;border-radius:50%;background:var(--tile);color:var(--acc);display:grid;place-items:center;font-size:12px;font-weight:700;object-fit:cover}
.cm-t{margin:8px 0 4px;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.cm-a{display:flex;gap:4px;margin-left:-6px}
.cm-m{color:var(--mut);font-size:14px;padding:16px 0}
.cm .cm-i .cm-f{margin:8px 0 0}
footer{border-top:1px solid var(--line);background:var(--surf);margin-top:64px}
footer .wrap{padding:28px 24px;font-size:13px;color:var(--mut)}
@media(max-width:900px){.picks,.g3{grid-template-columns:1fr 1fr}nav{gap:16px;flex-wrap:nowrap;overflow-x:auto}nav a{white-space:nowrap}.art h1{font-size:28px}}
@media(max-width:560px){.picks,.g3{grid-template-columns:1fr}.row .thumb{flex-basis:100%}.pn{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap bar">
 <a class="logo" href="#/"><span class="mark" id="mk">P</span><span id="logo"></span></a>
 <nav id="nav" aria-label="주 메뉴"></nav>
 <div class="tools">
  <button class="ib" id="srch" aria-label="검색"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <a class="btn-l" href="admin.html">관리자</a>
 </div>
</div>
<div class="wrap" id="q"><input id="qi" placeholder="글 검색" aria-label="글 검색"></div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script src="data.js"></script>
<script src="analytics.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{const t=new Date(d+"T00:00:00");return isNaN(t)?esc(d):t.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"})};
const safe=u=>/^(#|https?:|\/|[\w.-]+\.html)/.test(u)?u:"#/";
const enc=encodeURIComponent, PS=6;
let C,posts;
const by=id=>posts.find(p=>p.id===id), inCat=c=>posts.filter(p=>p.cats.includes(c));
const catList=()=>[...new Set(posts.flatMap(p=>p.cats))];
const pick=ids=>(ids||[]).map(by).filter(Boolean);
addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&!i.src.endsWith("placeholder.svg"))i.src="placeholder.svg"},true);
const thumb=p=>`<div class="thumb"><img loading="lazy" src="${esc(p.img||"placeholder.svg")}" alt=""><span class="lb">${esc(p.cats[0]||"")}</span></div>`;
const href=p=>`#/post/${enc(p.id)}`;
const hs=p=>((p.tags&&p.tags.length)?p.tags:p.cats).map(c=>"#"+esc(c)).join(" "); // 카드 아래 해시태그: 태그가 있으면 태그, 없으면 카테고리
const card=p=>`<a class="card" href="${href(p)}">${thumb(p)}<div class="date">${fmt(p.date)}</div><h3>${esc(p.title)}</h3><p>${esc(p.ex)}</p><span class="tag">${hs(p)}</span></a>`;
const chips=on=>`<div class="chips"><a class="chip ${on===""?"on":""}" href="#/all">전체</a>${catList().map(c=>`<a class="chip ${on===c?"on":""}" href="#/cat/${enc(c)}">${esc(c)}</a>`).join("")}</div>`;

const secHead=(t,more)=>`<div class="head"><h2>${esc(t)}</h2>${more?`<a href="${more}">전체 보기</a>`:""}</div>`;
const SEC={
 chips:()=>chips(null),
 picks:s=>{let ps=pick(s.ids);if(!ps.length)ps=posts.slice(0,3);return `<section class="picks" aria-label="추천 글">${ps.map(p=>`<a class="pick" href="${href(p)}">${thumb(p)}<h3>${esc(p.title)}</h3></a>`).join("")}</section>`},
 feature:s=>{const f=by(s.post)||posts[0];if(!f)return"";
  const art=`<a class="feat" href="${href(f)}">${thumb(f)}<div class="tx"><div class="date">${fmt(f.date)}</div><h3>${esc(f.title)}</h3><p>${esc(f.ex)}</p><span class="tag">${hs(f)}</span></div></a>`;
  const about=`<aside class="panel about"><h2 class="sh" style="align-self:flex-start;margin:0">소개</h2><div class="av">${esc((C.site.name||"P")[0])}</div><b>${esc(C.site.name)}</b><p style="font-size:13px;color:var(--mut)">AI와 프로덕트 기획을 기록하는 블로그</p><a class="btn" href="#/all">전체 글 보기</a></aside>`;
  return `<div class="two"><section><h2 class="sh">대표 글</h2>${art}</section>${s.about?about:""}</div>`},
 latest:s=>`${secHead(s.title||"최신 글","#/all")}<div class="g3">${posts.slice(0,s.count||6).map(card).join("")}</div><div class="more"><a class="btn-o" href="#/all">글 더 보기</a></div>`,
 category:s=>{const ps=inCat(s.cat).slice(0,s.count||3);return ps.length?`${secHead(s.title||s.cat,"#/cat/"+enc(s.cat))}<div class="g3">${ps.map(card).join("")}</div>`:""},
 text:s=>(s.title||s.body)?`<section class="panel txt" style="margin-top:40px;display:flex;flex-direction:column;gap:6px;align-items:flex-start">${s.title?`<h2 class="sh" style="margin:0">${esc(s.title)}</h2>`:""}${s.body?`<p>${esc(s.body).replace(/\n/g,"<br>")}</p>`:""}${s.label&&s.url?`<a class="btn" href="${esc(safe(s.url))}">${esc(s.label)}</a>`:""}</section>`:""
};
function home(){
 if(!posts.length)return`<p class="empty">아직 글이 없습니다.</p>`;
 return homeSections(C.home).map(s=>`<div data-sec="${esc(s.type)}" style="display:contents">${(SEC[s.type]||(()=>""))(s)}</div>`).join("");
}
function listView(title,ps,pg,base,on){
 const n=Math.max(1,Math.ceil(ps.length/PS)),pgNo=Math.min(Math.max(pg,1),n);
 const rows=ps.slice((pgNo-1)*PS,pgNo*PS).map(p=>`<a class="row" href="${href(p)}">${thumb(p)}<div class="tx"><div class="date">${fmt(p.date)}</div><h2>${esc(p.title)}</h2><p>${esc(p.ex)}</p><span class="tag">${hs(p)}</span></div></a>`).join("");
 const pager=n>1?`<nav class="pg" aria-label="페이지 이동">${Array.from({length:n},(_,i)=>`<a class="${i+1===pgNo?"on":""}" href="${base}/${i+1}">${i+1}</a>`).join("")}</nav>`:"";
 return `<div class="crumb"><a href="#/">홈</a> &nbsp;/&nbsp; 글 목록</div>
 <div class="lh"><div><h1>${esc(title)}</h1><p>총 ${ps.length}개의 글</p></div></div>${chips(on)}
 <div class="cols"><section>${rows||'<p class="empty">결과가 없습니다.</p>'}${pager}</section>
 <aside class="side"><div><h2>카테고리</h2><div class="catl">${catList().map(c=>`<a href="#/cat/${enc(c)}"><span>${esc(c)}</span><span style="color:var(--mut)">${inCat(c).length}</span></a>`).join("")}</div></div>
 <div><h2>최근 글</h2>${posts.slice(0,3).map(p=>`<a class="mini" href="${href(p)}"><div class="t"><img loading="lazy" src="${esc(p.img||"placeholder.svg")}" alt=""></div><div><span class="date">${fmt(p.date)}</span><b>${esc(p.title)}</b></div></a>`).join("")}</div></aside></div>`;
}
function post(p){
 const i=posts.indexOf(p),newer=posts[i-1],older=posts[i+1];
 const rel=posts.filter(x=>x!==p&&x.cats.some(c=>p.cats.includes(c))).slice(0,3);
 return `<div class="crumb"><a href="#/">홈</a> &nbsp;/&nbsp; <a href="#/all">글 목록</a> &nbsp;/&nbsp; ${esc(p.cats[0]||"")}</div>
 <div class="cols"><article class="art">
  ${p.cats.map(c=>`<a class="chip-s" href="#/cat/${enc(c)}">${esc(c)}</a>`).join("")}
  <h1>${esc(p.title)}</h1>
  <div class="meta"><span class="av">${esc((p.author||"A")[0])}</span><b style="color:var(--ink);font-weight:500">${esc(p.author)}</b><span>${fmt(p.date)}</span></div>
  <div class="hero"><img src="${esc(p.img||"placeholder.svg")}" alt=""></div>
  <p class="lead">${esc(p.ex)}</p><div id="pbody"></div>
  ${(p.tags||[]).length?`<div class="tags">${p.tags.map(t=>`<a href="#/tag/${enc(t)}">#${esc(t)}</a>`).join("")}</div>`:""}
  <div class="share" id="share"><b>공유하기</b>${shareBtns(p)}</div>
  <div id="cmt"></div>
  <nav class="pn" aria-label="이전·다음 글">${older?`<a href="${href(older)}"><small>이전 글</small><b>${esc(older.title)}</b></a>`:"<span></span>"}${newer?`<a href="${href(newer)}" style="text-align:right"><small>다음 글</small><b>${esc(newer.title)}</b></a>`:"<span></span>"}</nav>
 </article>
 <aside class="side" style="flex:1 1 260px;max-width:320px;min-width:240px;display:flex;flex-direction:column;gap:28px">
  <div class="panel about"><div class="av">${esc((C.site.name||"P")[0])}</div><b>${esc(C.site.name)}</b><p style="font-size:13px;color:var(--mut)">AI와 프로덕트 기획을 기록하는 블로그</p></div>
  ${rel.length?`<div><h2>관련 글</h2>${rel.map(x=>`<a class="mini" href="${href(x)}"><div class="t"><img loading="lazy" src="${esc(x.img||"placeholder.svg")}" alt=""></div><div><span class="date">${fmt(x.date)}</span><b>${esc(x.title)}</b></div></a>`).join("")}</div>`:""}
 </aside></div>`;
}
// 본문은 마크다운. TOAST UI Viewer(XSS 필터 내장)를 글 페이지에서만 지연 로드
const CDN="https://uicdn.toast.com/editor/3.2.2/",DEMO="본문이 아직 없습니다.";
function showBody(md){
 const go=()=>{const el=$("#pbody");if(el)new toastui.Editor({el,initialValue:(md||"").trim()||DEMO})};
 if(window.toastui)return go();
 document.head.insertAdjacentHTML("beforeend",`<link rel="stylesheet" href="${CDN}toastui-editor-viewer.min.css">`);
 const s=document.createElement("script");s.src=CDN+"toastui-editor-viewer.min.js";s.onload=go;document.head.append(s);
}
// 검색·공유용 메타를 화면에 맞게 바꾼다 (JS를 실행하는 검색엔진용). 공유 미리보기는 글 전용 주소(/post/글ID/)의 정적 메타를 본다
const setM=(sel,attr,v)=>{const e=document.querySelector(sel);if(e)e.setAttribute(attr,v)};
const shareUrl=p=>`${SITE_URL}/post/${enc(p.id)}/`;
// 글 공유: 링크 복사, X, Facebook, LinkedIn, 네이버, (지원하는 기기에서) 기기 공유창. 모두 글 전용 주소(/post/글ID/)를 공유한다
const shareBtns=p=>{
 const U=enc(shareUrl(p)),T=enc(p.title),a=(m,l,h)=>`<a class="btn-l" data-sh="${m}" href="${h}" target="_blank" rel="noopener noreferrer">${l}</a>`;
 return `<button class="btn-l" id="shr" data-sh="copy" type="button">링크 복사</button>`
  +(navigator.share?`<button class="btn-l" data-sh="native" type="button">기기로 공유</button>`:"")
  +a("x","X",`https://twitter.com/intent/tweet?url=${U}&text=${T}`)
  +a("facebook","Facebook",`https://www.facebook.com/sharer/sharer.php?u=${U}`)
  +a("linkedin","LinkedIn",`https://www.linkedin.com/sharing/share-offsite/?url=${U}`)
  +a("naver","네이버",`https://share.naver.com/web/shareView?url=${U}&title=${T}`);
};
async function onShare(e,p){
 const b=e.target.closest("[data-sh]");if(!b)return;const m=b.dataset.sh,u=shareUrl(p);
 if(m==="copy"){try{await navigator.clipboard.writeText(u);b.textContent="복사했습니다"}catch{prompt("링크를 복사하세요",u)}}
 else if(m==="native"){try{await navigator.share({title:p.title,text:p.ex,url:u})}catch{return}}
 gaEvent("share",{method:m==="copy"?"copy_link":m,content_type:"post",item_id:p.id});
}
// 주소창을 공유할 수 있는 주소로 맞춘다: 글은 /post/글ID/, 나머지는 /#/…. 미리보기(?demo, ?skin)와 다른 호스트(예: GitHub Pages)에서는 건드리지 않는다
function cleanUrl(h,p){
 if(/[?&](demo|skin)=/.test(location.search)||!(location.origin===SITE_URL||location.hostname==="localhost"))return;
 const want=p?`/post/${enc(p.id)}/`:(location.pathname.startsWith("/post/")?"/":location.pathname)+(h==="#/"?"":h);
 if(location.pathname+location.hash!==want)history.replaceState(null,"",want+location.search);
}
function seo(p,miss){
 const url=p?shareUrl(p):SITE_URL+"/",t=p?p.title+" — "+C.site.name:C.site.name,d=(p&&p.ex)||SITE_DESC;
 const img=p&&/^https?:\/\//.test(p.img||"")?p.img:SITE_URL+"/og-default.png";
 let rb=document.querySelector("meta[name=robots]");if(miss){if(!rb){rb=document.createElement("meta");rb.name="robots";document.head.append(rb)}rb.content="noindex"}else if(rb&&rb.content==="noindex")rb.remove();
 setM("meta[name=description]","content",d);setM("link[rel=canonical]","href",url);
 for(const [k,v] of [["og:title",t],["og:description",d],["og:url",url],["og:image",img],["og:type",p?"article":"website"]])setM(`meta[property="${k}"]`,"content",v);
}
// 메뉴가 넘치면 현재 메뉴가 보이게 옮기고, 더 있다는 표시(오른쪽 흐림)를 켠다
function navHint(){
 const n=$("#nav"),on=n.querySelector("a.on");
 if(on&&getComputedStyle(n).flexDirection==="row"){const r=on.getBoundingClientRect(),b=n.getBoundingClientRect();if(r.right>b.right||r.left<b.left)n.scrollLeft+=r.left-b.left-24}
 n.classList.toggle("fade",getComputedStyle(n).flexDirection==="row"&&n.scrollWidth-n.clientWidth-n.scrollLeft>2);
}
$("#nav").addEventListener("scroll",()=>navHint());addEventListener("resize",()=>navHint());
function route(){
 gaReadStop();
 const h=routeHash(),a=h.split("/").map(decodeURIComponent),k=a[1];
 let html,on=null;
 document.title=C.site.name;
 if(k==="post"&&by(a[2])){const p=by(a[2]);html=post(p);document.title=p.title+" — "+C.site.name}
 else if(k==="cat"){html=listView(a[2],inCat(a[2]),+a[3]||1,"#/cat/"+enc(a[2]),a[2])}
 else if(k==="tag"){html=listView("#"+a[2],posts.filter(p=>(p.tags||[]).includes(a[2])),+a[3]||1,"#/tag/"+enc(a[2]),null)}
 else if(k==="all"){html=listView("전체 글",posts,+a[2]||1,"#/all","")}
 else if(k==="search"){const q=a[2]||"";html=listView(`검색: ${q}`,posts.filter(p=>(p.title+p.ex+p.cats+(p.tags||[])).toLowerCase().includes(q.toLowerCase())),+a[3]||1,"#/search/"+enc(q),null)}
 else html=home();
 $("#app").innerHTML=html;scrollTo(0,0);
 if(k==="post"&&by(a[2])){const sp=by(a[2]);$("#share").onclick=e=>onShare(e,sp);showBody(by(a[2]).body);gaRead(by(a[2]).id);import("./comments.js").then(m=>m.mount($("#cmt"),by(a[2]).id)).catch(e=>console.warn("댓글 로드 실패",e))}
 const pp=k==="post"&&by(a[2])?by(a[2]):null,miss=k==="post"&&!pp&&location.pathname.startsWith("/post/"); // 없는 글 주소는 색인하지 않는다
 cleanUrl(h,pp);
 seo(pp,miss);
 gaView();
 $("#nav").innerHTML=C.nav.map(n=>`<a href="${esc(safe(n.url))}" class="${h===n.url||(n.url!=="#/"&&h.startsWith(n.url+"/"))?"on":""}">${esc(n.label)}</a>`).join("");
 navHint();
}
setTimeout(()=>document.body.classList.add("ready"),6000); // 불러오기가 오래 걸려도 빈 화면으로 두지 않는다
(async()=>{
 const qp=new URLSearchParams(location.search);
 C=qp.has("demo")?structuredClone(DEFAULT):await loadCfg(); // ?demo=1 샘플 데이터, ?skin=이름 스킨 미리보기
 posts=C.posts.filter(p=>p.status!=="draft").sort((a,b)=>b.date.localeCompare(a.date)); // 같은 날짜는 입력 순서 유지
 const S=C.site;
 const fk=SKINS[qp.get("skin")]?qp.get("skin"):"",sk=fk||(SKINS[S.skin]?S.skin:"plan-p"),SK=SKINS[sk];
 document.documentElement.dataset.skin=sk;
 if(SK.font)document.head.insertAdjacentHTML("beforeend",`<link rel="stylesheet" href="${SK.font}">`);
 const ac=fk?SK.accent:(S.accent||SK.accent),act=fk?SK.accentText:(S.accentText||(S.accent?ac:SK.accentText));
 document.head.insertAdjacentHTML("beforeend",`<style>:root{--acc:${ac};--acct:${act}}</style>`);
 $("#logo").textContent=S.name;$("#mk").textContent=(S.name||"P")[0];$("#foot").textContent=S.footer;
 if(gaOn())$("#foot").insertAdjacentHTML("beforeend",`<div style="margin-top:6px;font-size:12px">이 사이트는 방문 통계를 위해 Google Analytics를 사용합니다.</div>`);
 gaInit();gaBind();
 const at=()=>location.pathname+location.search+location.hash;let last="";
 const nav=()=>{if(at()===last)return;route();last=at()};
 addEventListener("hashchange",nav);addEventListener("popstate",nav);
 // 글 전용 주소(기준 주소가 루트)에서도 #/ 링크가 페이지를 새로 읽지 않고 화면만 바꾸게 한다
 document.addEventListener("click",e=>{const l=e.target.closest&&e.target.closest('a[href^="#/"]');if(!l||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||l.target)return;e.preventDefault();location.hash=l.getAttribute("href")});
 nav();document.body.classList.add("ready");
})();
$("#srch").onclick=()=>{$("#q").classList.toggle("on");$("#qi").focus()};
$("#qi").oninput=e=>{const v=e.target.value.trim();location.hash=v?"#/search/"+enc(v):"#/all"};
</script>
</body>
</html>
