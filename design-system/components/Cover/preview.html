<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--surface)}
.c{position:relative;width:960px;height:288px;overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;inset:0}
.brand{fill:var(--blue-600);rx:var(--radius-lg)}
.deep{fill:var(--blue-800);rx:var(--radius-lg)}
.soft{fill:var(--panel);rx:var(--radius-lg)}
.mid{fill:var(--blue-200);rx:var(--radius-lg)}
.pill{rx:16px}
.cut{fill:var(--surface)}.on-deep{fill:var(--blue-600)}.on-soft{fill:var(--blue-200)}
.tx{position:absolute;left:32px;bottom:28px;width:440px}
h1{margin:0;font-weight:700;font-size:120px;line-height:.95;color:var(--ink)}
p{margin:12px 0 0;font-weight:400;font-size:14px;line-height:1.5;color:var(--muted)}
</style></head>
<body><div class="c">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- 블록: brand slab 240×208, deep 232×128 (우측 bleed), panel 232×144 (우측 bleed), blue-200 240×64. 간격은 space-4(16px). 모서리 radius-lg.
     배치: 왼쪽 큰 slab 하나에 오른쪽 두 칸 쌓기와 아래 띠. x=496부터 시작해 이름 영역(x<480)을 비움.
     패턴: 필터 칩 모양의 pill. 이 시스템의 대표 컴포넌트가 칩이고 radius-pill 이 정체성이라서 부드러운 형태 행을 골랐음.
     단계: 폭은 space-4·space-5·space-6 배수(32·56·96·144), 높이는 32px 칩 높이 기준. -->
<rect class="brand" x="496" y="0" width="240" height="208"/>
<rect class="deep" x="752" y="0" width="232" height="128"/>
<rect class="soft" x="752" y="144" width="232" height="144"/>
<rect class="mid" x="496" y="224" width="240" height="64"/>
<rect class="pill cut" x="520" y="24" width="144" height="32"/>
<rect class="pill cut" x="520" y="72" width="96" height="32"/>
<rect class="pill cut" x="520" y="120" width="56" height="32"/>
<rect class="pill on-deep" x="776" y="24" width="104" height="32"/>
<rect class="pill on-deep" x="776" y="72" width="64" height="32"/>
<rect class="pill on-soft" x="776" y="168" width="120" height="32"/>
<rect class="pill on-soft" x="776" y="216" width="80" height="32"/>
</svg>
<div class="tx"><h1>Plan-P</h1><p>AI와 프로덕트 기획을 기록하는 블로그</p></div>
</div></body></html>
