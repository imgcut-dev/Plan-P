<!-- @dsCard group="Surfaces" height=220 subtitle="테두리 없는 연한 파랑 면" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-sans);display:flex;gap:20px;flex-wrap:wrap}
.p{flex:1 1 260px;background:var(--panel);border-radius:var(--radius-sm);padding:22px;box-sizing:border-box}
h3{margin:0 0 4px;font:700 15px var(--font-sans);color:var(--ink)}p{margin:0;font:400 13px/1.6 var(--font-sans);color:var(--muted)}
.li a{display:flex;justify-content:space-between;padding:12px 18px;font:400 14px var(--font-sans);color:var(--ink);border-bottom:1px solid var(--panel-line)}
.li a:last-child{border:0}.li{padding:0;overflow:hidden}
input{width:100%;height:40px;margin-top:10px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font:400 14px var(--font-sans);box-sizing:border-box}</style></head><body>
<div class="p"><h3>소개</h3><p>정보를 테두리 없이 연한 파랑 면으로 묶습니다.</p><input value="패널 안 입력창은 흰색" aria-label="예시 입력"></div>
<div class="p li"><a><span>AI</span><span style="color:var(--muted)">9</span></a><a><span>PM</span><span style="color:var(--muted)">8</span></a><a><span>기획</span><span style="color:var(--muted)">4</span></a></div>
</body></html>
