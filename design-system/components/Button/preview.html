<!doctype html><html lang="ko"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-sans)}
.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
button{height:42px;padding:0 20px;border-radius:var(--radius-sm);font:700 14px var(--font-sans);cursor:pointer}
.p{background:var(--blue-600);color:#fff;border:0}.s{background:var(--surface);color:var(--blue-700);border:1px solid var(--blue-600)}
.d{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}.x{background:var(--line);color:var(--muted);border:0;cursor:default}
.sm{height:36px;padding:0 14px;font-size:13px}</style></head><body>
<div class="r"><button class="p">발행</button><button class="s">보조</button><button class="d">임시저장</button><button class="x" disabled>비활성</button></div>
<div class="r"><button class="p sm">작게</button><button class="d sm">수정</button></div>
</body></html>
